---
# --- Internal root CA trust (must precede any HTTPS apt to Nexus) ------------
# Installed BEFORE apt runs so that, once apt is pointed at Nexus-over-HTTPS,
# the chain validates. On a cold start the controller has no root_ca.crt yet
# (PKI not deployed), so this is skipped and apt falls back to upstream below.
- name: Check if internal root CA cert exists on controller
  ansible.builtin.stat:
    path: "{{ common_root_ca_controller_path }}"
  delegate_to: localhost
  become: false
  register: common_root_ca_cert_stat

- name: Warn if internal root CA cert is not available
  ansible.builtin.debug:
    msg: >-
      {{ common_root_ca_controller_path }} not found on the Ansible controller.
      Skipping internal root CA trust setup (run pki-setup.yml first). apt will
      use the upstream Debian mirror until Nexus + PKI are up.
  when: not common_root_ca_cert_stat.stat.exists

- name: Copy internal root CA certificate to system trust store
  ansible.builtin.copy:
    src: "{{ common_root_ca_controller_path }}"
    dest: /usr/local/share/ca-certificates/internal-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == 'Debian'
    - common_root_ca_cert_stat.stat.exists
  notify: Update CA certificates

- name: Remove internal root CA from trust store when cert is absent on controller
  ansible.builtin.file:
    path: /usr/local/share/ca-certificates/internal-root-ca.crt
    state: absent
  when:
    - ansible_os_family == 'Debian'
    - not common_root_ca_cert_stat.stat.exists
  notify: Update CA certificates

- name: Apply CA trust now (before apt) so HTTPS apt to Nexus validates
  ansible.builtin.meta: flush_handlers

# Resolve internal service FQDNs (ca.<domain>, nexus.<domain>, ...) via /etc/hosts
# so the TLS mesh works on a cold start before DNSdist exists. Public names still
# go to the configured resolver (a public DNS during bootstrap).
- name: Write internal service FQDNs to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED — internal services"
    block: |
      {% for h in common_internal_hosts %}
      {{ h.ip }} {{ h.fqdn }}
      {% endfor %}
  when: common_internal_hosts | default([]) | length > 0

# --- Base apt repositories: Nexus when reachable, upstream Debian as fallback
# Sandbox hosts have direct internet, so Nexus is a caching optimisation, not a
# hard dependency. The probe + fallback removes the cold-start ordering trap
# where `common` (the first role on every host) assumed Nexus was already up.
- name: Probe Nexus apt proxy reachability
  ansible.builtin.uri:
    url: "{{ nexus_apt_proxy }}{{ common_nexus_status_path }}"
    method: GET
    validate_certs: false
    timeout: "{{ common_nexus_probe_timeout }}"
    status_code: [200, 401, 403, 404]
  register: common_nexus_probe
  # Retry a few times so a transient blip does not trip the fail-mode abort; the
  # message below names the real cause, not a downstream apt error.
  retries: "{{ common_nexus_probe_retries }}"
  delay: "{{ common_nexus_probe_delay }}"
  until: (common_nexus_probe.status | default(0)) in [200, 401, 403, 404]
  failed_when: false
  changed_when: false
  when:
    - nexus_apt_proxy | default('') | length > 0
    - inventory_hostname not in groups['nexus'] | default([])
    - ansible_distribution == 'Debian'

- name: Decide whether the Nexus apt proxy is usable
  ansible.builtin.set_fact:
    common_nexus_reachable: >-
      {{ (nexus_apt_proxy | default('') | length > 0)
         and (inventory_hostname not in groups['nexus'] | default([]))
         and ((common_nexus_probe.status | default(0)) in [200, 401, 403, 404]) }}

- name: Configure base Debian apt repositories
  when: ansible_distribution == 'Debian'
  block:
    # fail-mode (default): a configured-but-unreachable Nexus is a real fault, not
    # a bootstrap condition. Abort with a clear message naming the cause instead
    # of silently chasing upstream (which is firewalled-off in production anyway).
    # Bootstrap tooling overrides nexus_fallback=upstream where this is expected.
    - name: Fail fast when Nexus is unreachable in fail mode
      ansible.builtin.fail:
        msg: >-
          Nexus apt proxy ({{ nexus_apt_proxy }}) is unreachable after
          {{ common_nexus_probe_retries }} retries — aborting. nexus_fallback is
          'fail' (the default), so there is no upstream fallback (firewalled
          production has no usable upstream mirror). If this is a cold bootstrap
          where Nexus does not exist yet, re-run with -e nexus_fallback=upstream.
      when:
        - nexus_fallback | default('fail') == 'fail'
        - not (common_nexus_reachable | bool)
        - nexus_apt_proxy | default('') | length > 0
        - inventory_hostname not in groups['nexus'] | default([])

    - name: Use Nexus-proxied Debian sources (Nexus reachable)
      when: common_nexus_reachable | bool
      block:
        - name: Deploy Nexus-proxied Debian sources (DEB822)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/debian-nexus.sources
            owner: root
            group: root
            mode: "0644"
            content: |
              Types: deb
              URIs: {{ nexus_apt_proxy }}/repository/apt-proxy-trixie/
              Suites: {{ common_debian_suite }}
              Components: main contrib non-free non-free-firmware
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

              Types: deb
              URIs: {{ nexus_apt_proxy }}/repository/apt-proxy-trixie-updates/
              Suites: {{ common_debian_suite }}-updates
              Components: main contrib non-free non-free-firmware
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

              Types: deb
              URIs: {{ nexus_apt_proxy }}/repository/apt-proxy-trixie-security/
              Suites: {{ common_debian_suite }}-security
              Components: main contrib non-free non-free-firmware
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

        - name: Configure Nexus APT credentials
          ansible.builtin.copy:
            dest: /etc/apt/auth.conf.d/nexus.conf
            owner: root
            group: root
            mode: "0600"
            content: |
              machine {{ nexus_apt_proxy }} login nexus-reader password {{ lookup('env', 'NEXUS_READER_PASSWORD') }}
          when: lookup('env', 'NEXUS_READER_PASSWORD') | length > 0

        - name: Remove default + upstream-fallback sources while using Nexus
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list
            - /etc/apt/sources.list.d/debian.sources
            - /etc/apt/sources.list.d/debian-upstream.sources

    - name: Use upstream Debian sources (Nexus unreachable — fallback)
      when: not (common_nexus_reachable | bool)
      block:
        - name: Deploy upstream Debian sources (DEB822 fallback)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/debian-upstream.sources
            owner: root
            group: root
            mode: "0644"
            content: |
              Types: deb
              URIs: {{ common_debian_upstream_uri }}
              Suites: {{ common_debian_suite }} {{ common_debian_suite }}-updates
              Components: main contrib non-free non-free-firmware
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

              Types: deb
              URIs: {{ common_debian_security_uri }}
              Suites: {{ common_debian_suite }}-security
              Components: main contrib non-free non-free-firmware
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

        - name: Remove Nexus-proxied sources + creds while falling back to upstream
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list
            - /etc/apt/sources.list.d/debian.sources
            - /etc/apt/sources.list.d/debian-nexus.sources
            - /etc/apt/auth.conf.d/nexus.conf

# Freshly-booted hosts — especially VMs cloned from a template (e.g. the offline
# root CA) — run apt-daily / unattended-upgrades on first boot, holding the dpkg
# lock for several minutes. The deploy starts such a VM and configures it
# immediately, so the apt tasks below race that lock and fail.
# Two-part fix: (1) stop the auto-apt TIMERS so they can't re-fire mid-deploy;
# (2) actively WAIT for any ALREADY-RUNNING first-boot apt/dpkg to finish and
# release the lock. (1) alone is insufficient — it does not touch a run that is
# already in flight, which is exactly what held the lock and broke base-package
# install on a true cold start. (LXCs are unaffected; harmless+idempotent there.)
- name: Quiesce automatic apt timers (avoid first-boot dpkg lock races)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false

- name: Wait for any in-flight first-boot automatic apt/dpkg to release the lock
  # Wait on the real dpkg frontend lock rather than matching process names:
  # `flock -w` blocks until the lock is free (then releases it immediately, so
  # the apt tasks below are unaffected) or exits non-zero after the ceiling.
  # This avoids the pgrep -f self-match trap, where the wait command's own argv
  # contained the pattern strings and matched itself forever. ~10 min ceiling.
  ansible.builtin.command:
    cmd: flock -w 600 /var/lib/dpkg/lock-frontend true
  changed_when: false
  when: ansible_distribution == 'Debian'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - vim
      - htop
      - ca-certificates
      - gnupg
      - python3
      - python3-pip
    state: present
    lock_timeout: 600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone | default('UTC') }}"

- name: Disable root SSH password login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    state: present
  notify: Restart sshd

- name: Configure auth log forwarding to log-server
  when: common_log_server_address | length > 0
  block:
    - name: Install rsyslog
      ansible.builtin.apt:
        name: rsyslog
        state: present
        lock_timeout: 300

    - name: Deploy rsyslog auth forwarding config
      ansible.builtin.template:
        src: rsyslog-auth-forward.conf.j2
        dest: /etc/rsyslog.d/60-auth-forward.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart rsyslog

    - name: Ensure rsyslog is enabled and started
      ansible.builtin.systemd:
        name: rsyslog
        state: started
        enabled: true

- name: Remove rsyslog auth forwarding config when log server is not configured
  ansible.builtin.file:
    path: /etc/rsyslog.d/60-auth-forward.conf
    state: absent
  when: common_log_server_address | length == 0

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald to forward to syslog
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/forward-to-syslog.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      ForwardToSyslog=yes
  notify: Restart journald
