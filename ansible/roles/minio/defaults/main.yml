---
minio_data_dir: /var/lib/minio/data
minio_port: 9000
minio_console_port: 9001
minio_checksum: "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f"  # From https://dl.min.io/server/minio/release/linux-amd64/minio.sha256sum

# TLS configuration (via step-ca JWK provisioner)
# minio_tls_enabled, minio_domain, and minio_ca_url are propagated from config/<env>.yml
# via make configure → ansible/inventory/hosts.yml group vars. Do not hardcode here.
minio_tls_enabled: false
minio_domain: ""
minio_ca_url: ""
minio_certs_dir: /etc/minio/certs
minio_ca_root: /usr/local/share/ca-certificates/internal-root-ca.crt
minio_jwk_provisioner: acme  # Name of the JWK provisioner on the issuing CA (not the ACME protocol provisioner)
# Cert lifetime requested at issuance/re-enroll. Capped by the issuing CA's
# maxTLSCertDuration; keep renewal headroom well below this (the renewer timer
# fires every 15 min and step renews at ~2/3 of the lifetime).
minio_cert_duration: "24h"
# Root-only file holding the JWK provisioner password, used by the self-heal
# renewer to RE-ENROLL a fully-expired cert (`step ca renew` alone cannot recover
# a cert past notAfter). Mirrors the nexus cert-renewer pattern.
minio_prov_pass_persist: "/etc/minio/certs/.provisioner-pass"
# Secondary SAN (the MinIO host IP) for the server cert, propagated from
# config/<env>.yml via make configure. Empty here so role defaults stay
# deployment-agnostic; the generator emits it into the minio group vars.
minio_endpoint_ip: ""
