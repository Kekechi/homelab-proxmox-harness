---
- name: Reload systemd and restart step-ca
  ansible.builtin.systemd:
    daemon_reload: true
    name: step-ca
    state: restarted

# step-ca exits on SIGHUP under this systemd unit (it does not re-exec cleanly),
# which left the CA dead after a config change. Restart instead — a brief CA
# restart is acceptable in this homelab and guarantees the new config is loaded
# and the service ends running.
- name: Reload step-ca config
  ansible.builtin.systemd:
    name: step-ca
    state: restarted
