---
# otelcol-contrib version to install (pinned for reproducibility)
otelcol_version: "0.150.1"

# SHA256 checksum for the version above.
# Get from: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v<version>/otelcol-contrib_<version>_checksums.txt
# Must be updated whenever otelcol_version changes.
otelcol_checksum: "c8ded6c8dbe38e63b63fbfb86b5eff485ba91616254b58ae21dc71d03ba1b922"

# nexus_fallback (phase-keyed run parameter, NOT per-env config) is a shared,
# intentionally un-prefixed cross-role var emitted into inventory all.vars by
# generate-configs.py with the fail-safe default 'fail'. It is NOT a role default
# (that would mis-prefix it); the rescue in tasks/install.yml guards with
# `| default('fail')` as the fail-safe floor. Bootstrap tooling overrides to
# 'upstream' via -e. See docs/design/apt-fallback-policy.md.

# MinIO bucket for log storage
otelcol_minio_bucket: "otelcol-logs"

# MinIO endpoint — overridden by gen_inventory for the log_server group.
# Empty default: main.yml asserts non-empty before continuing.
otelcol_minio_endpoint: ""

# Memory limiter processor
otelcol_memory_limit_mib: 400
otelcol_memory_spike_limit_mib: 100
otelcol_memory_check_interval: "1s"

# Batch processor
otelcol_batch_timeout: "60s"
otelcol_batch_size: 1000

# Syslog TCP port for DNS query logs (1514 is firewall syslog)
otelcol_dns_syslog_port: 1515

# Syslog TCP port for managed-host auth events
otelcol_auth_syslog_port: 1516

# Splunk HEC exporter — DISABLED by default. Splunk is deprecation-planned; the
# primary sink is the MinIO awss3 exporter. The generator sets this true only
# when services.splunk is enabled with an IP. When false, the splunk_hec
# exporter, its pipeline fan-out, asserts, and token lookup are all skipped.
otelcol_splunk_hec_enabled: false
# Splunk HEC endpoint/token — only used when otelcol_splunk_hec_enabled.
otelcol_splunk_hec_url: ""
otelcol_splunk_hec_token: ""

# otelcol-contrib DEB: prefer a Nexus raw repo (locked-down production hosts),
# fall back to the upstream GitHub release when the raw repo is not seeded
# (cold start / sandbox) so the deploy is self-sufficient.
otelcol_deb_filename: "otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
otelcol_nexus_raw_url: "{{ nexus_apt_proxy }}/repository/otelcol-contrib/{{ otelcol_deb_filename }}"
otelcol_release_base: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download"
otelcol_upstream_url: "{{ otelcol_release_base }}/v{{ otelcol_version }}/{{ otelcol_deb_filename }}"
