---
- name: Check installed otelcol-contrib version
  ansible.builtin.command: dpkg-query -W -f='${Version}' otelcol-contrib
  register: otelcol_installed_version
  failed_when: false
  changed_when: false

# Prefer a Nexus raw repo (works on locked-down production MGMT-VLAN hosts with
# no direct internet); fall back to the upstream GitHub release when the raw
# repo is not seeded (cold start / sandbox), so the deploy is self-sufficient.
- name: Download otelcol-contrib DEB (Nexus raw, fallback to upstream)
  when: otelcol_installed_version.rc != 0 or otelcol_installed_version.stdout != otelcol_version
  block:
    - name: Download otelcol-contrib DEB from Nexus raw repo
      ansible.builtin.get_url:
        url: "{{ otelcol_nexus_raw_url }}"
        dest: "/tmp/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
        checksum: "sha256:{{ otelcol_checksum }}"
        mode: "0644"
        url_username: nexus-reader
        url_password: "{{ nexus_reader_password | default('') }}"
      no_log: true
  rescue:
    # fail-mode (default): a Nexus raw fetch failure is a real fault, not a
    # bootstrap condition — re-raise with a clear message instead of silently
    # chasing the upstream GitHub release (firewalled-off in production).
    - name: Abort — otelcol Nexus raw fetch failed in fail mode
      ansible.builtin.fail:
        msg: >-
          otelcol-contrib download from the Nexus raw repo
          ({{ otelcol_nexus_raw_url }}) failed and nexus_fallback is 'fail' (the
          default) — aborting, no upstream fallback (firewalled production has no
          usable upstream). For a cold bootstrap re-run with
          -e nexus_fallback=upstream.
      when: nexus_fallback | default('fail') == 'fail'

    - name: Download otelcol-contrib DEB from upstream (Nexus raw unavailable)
      ansible.builtin.get_url:
        url: "{{ otelcol_upstream_url }}"
        dest: "/tmp/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
        checksum: "sha256:{{ otelcol_checksum }}"
        mode: "0644"

- name: Install otelcol-contrib DEB
  ansible.builtin.apt:
    deb: "/tmp/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
  when: otelcol_installed_version.rc != 0 or otelcol_installed_version.stdout != otelcol_version
  notify:
    - Reload systemd
    - Restart otelcol-contrib

- name: Remove downloaded otelcol-contrib DEB
  ansible.builtin.file:
    path: "/tmp/otelcol-contrib_{{ otelcol_version }}_linux_amd64.deb"
    state: absent
